; DHU profile approximating the CAOA Changan Uni-T 2026 head unit.
; 10.25" wide panel (1920x720), which Android Auto sees as 1920x1080 video with 360px
; of vertical margin. Not taken from the car's logged values, but the layout was
; checked side by side against the real car and matches.
[general]
touch = true
touchpad = false
controller = false
instrumentcluster = false
resolution = 1920x1080
marginheight = 360
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
